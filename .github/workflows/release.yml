name: Release IPK

on:
  push:
    tags: ["v*"]

jobs:
  ipk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: |
          sudo apt-get update
          sudo apt-get install -y opkg-utils
          chmod +x packaging/build-ipk.sh
          VERSION=${GITHUB_REF_NAME#v} packaging/build-ipk.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: enigmacast-sync-ipk
          path: dist/*
