name: Release IPK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ipk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: VERSION=${GITHUB_REF_NAME#v} python3 packaging/build_ipk.py dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk
          generate_release_notes: true
